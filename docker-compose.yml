services:
  # Meilisearch - Search engine
  meilisearch:
    image: getmeili/meilisearch:v1.24.0
    container_name: kidsearch-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:-masterKey}
      MEILI_NO_ANALYTICS: true
      # Increased for better caching - keeps index in RAM to avoid HDD cold starts
      MEILI_MAX_INDEXING_MEMORY: 2GB
      MEILI_MAX_INDEXING_THREADS: 2
    # Docker memory limits - guarantee RAM allocation
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 1.5G
    volumes:
      # Use Docker volume instead of hardcoded Synology path
      - ./meili_data:/meili_data
    networks:
      - kidsearch-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  embeddings_small:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.2
    container_name: embeddings_small
    restart: unless-stopped
    networks:
      - kidsearch-network
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      RAYON_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    ports:
      - "8090:80"
    command:
      - "--model-id"
      - "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      - "--port"
      - "80"
      - "--pooling"
      - "mean"
    volumes:
      - ./models_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

  # KidSearch Dashboard & API (All-in-one)
  kidsearch-all:
    image: gandulf78/kidsearch:latest
    container_name: kidsearch-all
    restart: unless-stopped
    ports:
      - "8501:8501"  # Dashboard
      - "8082:8080"  # API
    dns:
      - 1.1.1.3
      - 1.0.0.3
    # extra_hosts: # Décommentez et configurez si nécessaire
    #   - "auth.example.com:192.168.1.1"
    environment:
      SERVICE: all
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # === AUTHENTICATION CONFIGURATION ===

      # Force a single auth method (optional)
      # Options: proxy, oidc, google, github, simple
      # If empty, auto-detects based on configured variables
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}

      # --- Proxy Authentication (Recommended for Production) ---
      # Use with Caddy + authcrunch
      # authcrunch automatically injects headers: X-Token-User-Email, X-Token-User-Name
      # Caddyfile directive: inject headers with claims
      AUTH_PROXY_ENABLED: ${AUTH_PROXY_ENABLED:-false}
      AUTH_PROXY_LOGOUT_URL: ${AUTH_PROXY_LOGOUT_URL:-/}

      # --- OpenID Connect (OIDC) ---
      # For direct OIDC authentication (without proxy)
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8501/}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_API_REDIRECT_URI: ${OIDC_API_REDIRECT_URI:-http://localhost:8082/api/auth/callback}

      # --- Simple Password Authentication ---
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}

      # --- Email Whitelist (for Proxy & OAuth) ---
      # Comma-separated list of allowed emails
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}

      # --- Google OAuth (optional) ---
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8501/}

      # --- GitHub OAuth (optional) ---
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8501/}

      # === JWT CONFIGURATION (for API authentication) ===
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}

      # === API CONFIGURATION ===
      # URL for Dashboard to communicate with API (internal Docker network)
      API_URL: ${API_URL:-http://kidsearch-all:8080/api}
      API_ENABLED: ${API_ENABLED:-true}
      API_WORKERS: ${API_WORKERS:-2}

      # Meilisearch connection
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_KEY:-masterKey}
      INDEX_NAME: ${INDEX_NAME:-kidsearch}

      # Other settings...
      FRONTEND_URL: ${FRONTEND_URL:-}
      DISPLAY_HOST: ${DISPLAY_HOST:-}
      # ... (rest of the variables)

    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./streamlit:/app/.streamlit
    networks:
      - kidsearch-network
    depends_on:
      meilisearch:
        condition: service_healthy
      embeddings_small:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  kidsearch-network:
    driver: bridge
