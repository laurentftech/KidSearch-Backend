services:
  # Typesense - In-memory Search Engine
  typesense:
    image: typesense/typesense:29.0
    container_name: kidsearch-typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-masterKey}
      TYPESENSE_ENABLE_CORS: "true"
    # Docker memory limits - guarantee RAM allocation
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 1.5G
    volumes:
      - ./typesense_data:/data
    networks:
      - kidsearch-network

  embeddings_small:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3
    container_name: embeddings_small
    restart: unless-stopped
    networks:
      - kidsearch-network
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      RAYON_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    ports:
      - "8090:80"
    command:
      - "--model-id"
      - "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      - "--port"
      - "80"
      - "--pooling"
      - "mean"
    volumes:
      - ./models_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

  # KidSearch Dashboard & API (All-in-one)
  kidsearch-all:
    build: .
    image: gandulf78/kidsearch:latest
    container_name: kidsearch-all
    restart: unless-stopped
    ports:
      - "8501:8501"  # Dashboard
      - "8082:8080"  # API
    dns:
      - 1.1.1.3
      - 1.0.0.3
    # extra_hosts: # Décommentez et configurez si nécessaire
    #   - "auth.example.com:192.168.1.1"
    environment:
      SERVICE: all
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # === AUTHENTICATION CONFIGURATION ===

      # Disable authentication completely (for development)
      AUTH_DISABLED: ${AUTH_DISABLED:-false}

      # Force a single auth method (optional)
      # Options: proxy, oidc, google, github, simple
      # If empty, auto-detects based on configured variables
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}

      # --- Proxy Authentication (Recommended for Production) ---
      # Use with Caddy + authcrunch
      # authcrunch automatically injects headers: X-Token-User-Email, X-Token-User-Name
      # Caddyfile directive: inject headers with claims
      AUTH_PROXY_ENABLED: ${AUTH_PROXY_ENABLED:-false}
      AUTH_PROXY_LOGOUT_URL: ${AUTH_PROXY_LOGOUT_URL:-/}

      # --- OpenID Connect (OIDC) ---
      # For direct OIDC authentication (without proxy)
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8501/}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_API_REDIRECT_URI: ${OIDC_API_REDIRECT_URI:-http://localhost:8082/api/auth/callback}

      # --- Simple Password Authentication ---
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}

      # --- Email Whitelist (for Proxy & OAuth) ---
      # Comma-separated list of allowed emails
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}

      # --- Google OAuth (optional) ---
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8501/}

      # --- GitHub OAuth (optional) ---
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8501/}

      # === JWT CONFIGURATION (for API authentication) ===
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}

      # === API CONFIGURATION ===
      # URL for Dashboard to communicate with API (internal Docker network)
      API_URL: ${API_URL:-http://kidsearch-all:8080/api}
      API_ENABLED: ${API_ENABLED:-true}
      API_WORKERS: ${API_WORKERS:-2}

      # Typesense connection
      TYPESENSE_URL: ${TYPESENSE_URL:-http://typesense:8108}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-masterKey}
      INDEX_NAME: ${INDEX_NAME:-kidsearch}

      # Embedding configuration
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-huggingface}
      HUGGINGFACE_API_URL: ${HUGGINGFACE_API_URL:-http://embeddings_small:80/embed}
      HUGGINGFACE_MODEL: ${HUGGINGFACE_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_BATCH_DELAY: ${EMBEDDING_BATCH_DELAY:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_BATCH_SIZE: ${GEMINI_EMBEDDING_BATCH_SIZE:-20}

      # Reranking configuration
      RERANKING_ENABLED: ${RERANKING_ENABLED:-true}
      RERANKER_API_URL: ${RERANKER_API_URL:-http://embeddings_small:80/embed}
      RERANKER_MODEL: ${RERANKER_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-3}
      RERANKER_MAX_CHARS: ${RERANKER_MAX_CHARS:-200}
      RERANKER_CACHE_SIZE: ${RERANKER_CACHE_SIZE:-4096}
      RERANKER_TIMEOUT: ${RERANKER_TIMEOUT:-12}

      # Search weights
      MEILISEARCH_WEIGHT: ${MEILISEARCH_WEIGHT:-0.7}
      CSE_WEIGHT: ${CSE_WEIGHT:-0.3}

      # Google CSE
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}

      # Wiki configuration
      WIKI_API_URL: ${WIKI_API_URL:-}
      WIKI_SITE_URL: ${WIKI_SITE_URL:-}
      WIKI_SITE_NAME: ${WIKI_SITE_NAME:-}
      WIKI_2_API_URL: ${WIKI_2_API_URL:-}
      WIKI_2_SITE_URL: ${WIKI_2_SITE_URL:-}
      WIKI_2_SITE_NAME: ${WIKI_2_SITE_NAME:-}

      # Other settings
      FRONTEND_URL: ${FRONTEND_URL:-}
      DISPLAY_HOST: ${DISPLAY_HOST:-}
      DASHBOARD_DISPLAY_HOST: ${DASHBOARD_DISPLAY_HOST:-}
      API_DISPLAY_HOST: ${API_DISPLAY_HOST:-}

    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./streamlit:/app/.streamlit
    networks:
      - kidsearch-network
    depends_on:
      typesense:
        condition: service_started
      embeddings_small:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  kidsearch-network:
    driver: bridge
